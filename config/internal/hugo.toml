# The internal build: `hugo --environment internal` (make site-internal-build).
# Merged over hugo.toml; renders ONLY the /internal/ section. The public
# content is not duplicated here: it goes stale in step with this build's
# cadence, and the internal pages never linked to it. The shared codebase,
# shell components and build pipeline are the economy; the content is not.
# The entry point is /internal/; the root redirects there (below). Never
# deploy this output to blowhorn.ai.

# The "internal" segment (hugo.toml) includes only /internal/**. Not
# ["public", "internal"]: public's excludes would drop /internal/.
renderSegments = ["internal"]

# Only this environment mounts static-internal/ (see [module] below): its
# index.html is the root redirect to /internal/, so the build's root is
# not a dead end.

# Hugo replaces module.imports per environment instead of merging, so the
# base imports are repeated here (keep in step with hugo.toml).
[module]
  # The root redirect: static-internal/index.html lands at the output's
  # root only in this environment (the base mounts in hugo.toml are kept;
  # mounts merge across the environment config, imports do not).
  [[module.mounts]]
    source = "static-internal"
    target = "static"
  # The private leecalcote/blowhorn clone. make site-internal sets
  # HUGO_MODULE_REPLACEMENTS to BLOWHORN_DIR (default ../blowhorn); with no
  # replacement Hugo would try to download the private repository and fail.
  [[module.imports]]
    path = "github.com/google/docsy"
    disable = false
  [[module.imports]]
    path = "github.com/google/docsy/dependencies"
    disable = false
  [[module.imports]]
    path = "github.com/leecalcote/blowhorn"
    ignoreConfig = true
    # GTM strategy pages (Hugo markdown and page bundles).
    [[module.imports.mounts]]
      source = "marketing/strategy/hugo/strategy"
      target = "content/internal/strategy"
    # Break-even page, its report wrapper and the model's downloads.
    [[module.imports.mounts]]
      source = "marketing/strategy/hugo/finance"
      target = "content/internal/finance"
    [[module.imports.mounts]]
      source = "marketing/strategy/finance/blowhorn-breakeven-model.xlsx"
      target = "content/internal/finance/blowhorn-breakeven-model.xlsx"
    [[module.imports.mounts]]
      source = "marketing/strategy/finance/blowhorn-breakeven.html"
      target = "assets/internal/finance/blowhorn-breakeven.html"
    [[module.imports.mounts]]
      source = "marketing/strategy/finance/build"
      target = "assets/internal/finance/build"
    # Data for /internal/strategy/compare/ (CSV: Hugo's data/ does not take
    # CSV, so it mounts into assets and the shortcode unmarshals it).
    [[module.imports.mounts]]
      source = "marketing/capability-comparison/compare-assistants.csv"
      target = "assets/internal/compare-assistants.csv"
    # Data for /internal/strategy/persona-matrix/ (same pattern as the
    # assistant comparison above).
    [[module.imports.mounts]]
      source = "marketing/capability-comparison/compare-personas.csv"
      target = "assets/internal/compare-personas.csv"
