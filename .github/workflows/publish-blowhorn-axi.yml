name: Publish Blowhorn npm packages (blowhorn-axi, blowhorn-mcp)

# Publishes one of Blowhorn's npm packages with npm trusted publishing over
# OIDC, chosen by the `package` input:
#   - blowhorn-axi: the agent interface to Blowhorn (the default, so callers
#     that do not pass `package` publish blowhorn-axi as before).
#   - blowhorn-mcp: a thin launcher for the Blowhorn MCP server.
# No npm token is stored anywhere: npmjs.com trusts this repository and this
# workflow file, and the publish carries a provenance attestation
# (`--provenance`, so a missing OIDC token fails the run instead of publishing
# without one). The file keeps its original name because trusted publishers
# bind to the workflow filename.
#
# Each package is built in the private product repo with `npm pack` and handed
# over as a tarball, so this workflow never needs to read that repo:
#   - tarball_url: an HTTPS URL of <package>-<version>.tgz, or
#   - release_tag: a release of this repository that has the tarball as an asset
#     (defaults to v<version> for blowhorn-axi and mcp-v<version> for
#     blowhorn-mcp when neither input is given).
# It does not wait for a desktop release.
#
# Every step that runs repository logic is a make target (npm-fetch,
# npm-verify, npm-publish, npm-confirm) backed by a script in
# .github/scripts/publish-npm/, so `make <target>` reproduces it.
#
# Run: Actions > Publish Blowhorn npm packages > Run workflow, or
#   gh workflow run publish-blowhorn-axi.yml -R blowhorn-ai/blowhorn-site \
#     -f version=0.1.0 -f release_tag=axi-v0.1.0
#   gh workflow run publish-blowhorn-axi.yml -R blowhorn-ai/blowhorn-site \
#     -f package=blowhorn-mcp -f version=0.1.0 -f release_tag=mcp-v0.1.0
#
# One-time setup on npmjs.com, once per package (package Settings > Trusted
# publishing): GitHub Actions, organization blowhorn-ai, repository
# blowhorn-site, workflow publish-blowhorn-axi.yml, no environment, and tick
# "allow npm publish". Trusted publisher configs created after Sep 3, 2026
# allow only `npm stage publish` by default, and this workflow runs plain
# `npm publish`, so without that box the publish fails with E404.
# A brand-new package must already exist on npm before a trusted publisher can
# be added to it, so a maintainer publishes a first placeholder version by hand
# once; every later version goes through this workflow.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "npm package to publish"
        required: false
        type: choice
        options:
          - blowhorn-axi
          - blowhorn-mcp
        default: blowhorn-axi
      version:
        description: "Version to publish, e.g. 0.1.0 (must match the tarball's package.json)"
        required: true
        type: string
      tarball_url:
        description: "HTTPS URL of <package>-<version>.tgz (leave empty to use a release asset)"
        required: false
        type: string
      release_tag:
        description: "Release of this repo holding <package>-<version>.tgz (default v<version> for blowhorn-axi, mcp-v<version> for blowhorn-mcp)"
        required: false
        type: string
      sha256:
        description: "Expected sha256 of the tarball (optional, checked when given)"
        required: false
        type: string
      dist_tag:
        description: "npm dist-tag"
        required: false
        type: string
        default: latest

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      # The Makefile and .github/scripts/publish-npm/ hold the steps below.
      # Only this repository is checked out, never the product repo.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Use npm 11.5.1 or newer (trusted publishing)
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Fetch the tarball
        env:
          VERSION: ${{ inputs.version }}
          TARBALL_URL: ${{ inputs.tarball_url }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: make npm-fetch

      - name: Verify the tarball
        env:
          VERSION: ${{ inputs.version }}
          SHA256: ${{ inputs.sha256 }}
        run: make npm-verify

      - name: Publish (OIDC trusted publishing, provenance)
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: make npm-publish

      - name: Confirm
        env:
          VERSION: ${{ inputs.version }}
        # Polls for about 5 minutes, then warns; never fails the job.
        run: make npm-confirm
