name: Site

# Builds and checks blowhorn.ai on every pull request and push to master, and
# deploys it to GitHub Pages (Settings > Pages > Source: GitHub Actions) on
# master. The toolchain is pinned in the repository: Go by go.mod (Hugo
# modules), Node.js by .nvmrc, and Hugo extended by package.json
# (hugo-extended). See docs/deploy.md.

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Lint, build and check
    runs-on: ubuntu-24.04
    steps:
      # Hugo module fetching reaches proxy.golang.org and sum.golang.org, and
      # the hugo-extended package downloads Hugo from github.com. Harmless under
      # egress-policy: audit; list them in allowed-endpoints before blocking.
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      # Full history so Hugo's git info gives each page its own last-modified date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: make setup-ci

      - name: Lint workflows
        run: make workflow-check

      - name: Test check scripts
        run: make test-scripts

      # Every step below is a make target; `make ci` runs the same sequence locally.
      # site-check: check-schemas, then one production build into public/, then
      # validate-html, check-links, check-third-party, check-urls, check-no-internal
      # and check-theme.
      - name: Build and check site
        run: make site-check

      # Belt and braces: site-check runs this too. The public deploy must never
      # carry the /internal/ segment (see docs/deploy.md, "Internal section").
      - name: Fail if the public build contains /internal/
        run: .github/scripts/check-no-internal.sh public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
