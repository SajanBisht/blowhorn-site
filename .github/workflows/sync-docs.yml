name: Sync product docs

# Mirrors the private product docs (leecalcote/blowhorn docs/{tutorials,
# how-to,reference,explanation} and docs/README.md) into content/en/docs/
# and opens or updates one 'docs: sync from <ref>' pull request, then starts
# site.yml on that branch itself: pushes and pull requests made with
# github.token never start pull_request or push workflows, so site.yml would
# otherwise stay silent on the sync PR, while a workflow_dispatch run started
# with that same token is allowed and attaches to the branch head. Once those
# checks pass the workflow merges the PR itself and starts site.yml on master
# the same way — a merge made with that token starts no push workflows — and
# that master run deploys. See docs/deploy.md.
#
# Triggers:
#   - Manual: Actions > Sync product docs > Run workflow (input: ref).
#   - repository_dispatch (event type "sync-docs") from the product repo's
#     CI, with client_payload: {"ref"}.
#   - publish-dmg.yml, after a public release, at the product tag
#     desktop-<version> (make dmg-sync-docs).
#
# Every step that runs repository logic is a make target (docs-sync) backed
# by .github/scripts/sync-docs.py, so a maintainer can run the same flow
# locally.
#
# Safety rules enforced here:
#   - The product checkout is read-only (persist-credentials: false) and
#     DMG_SOURCE_TOKEN authenticates only to GitHub, as in publish-dmg.yml.
#   - docs/internal/, docs/gtm/ and internal-paths.txt entries never sync.
#   - The workflow only ever pushes the docs-sync branch, opens or
#     updates one pull request, and merges that pull request once the
#     checks it started on it pass; it never pushes to master directly.
#     Commits are signed off (DCO).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch or SHA of leecalcote/blowhorn to sync"
        required: false
        default: master
        type: string
  repository_dispatch:
    types:
      - sync-docs

permissions:
  contents: read

concurrency:
  group: sync-docs
  cancel-in-progress: false

jobs:
  sync:
    name: Sync docs and open PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Lets this job start site.yml on the docs-sync branch with
      # workflow_dispatch after opening the sync PR, and on master after
      # merging it (see the last steps).
      actions: write
    env:
      SYNC_REF: ${{ github.event.inputs.ref || github.event.client_payload.ref || 'master' }}
      SYNC_BRANCH: docs-sync
    steps:
      # Full history so the docs-sync branch starts from the right place.
      # Credentials stay for the push.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # Read-only mirror of publish-dmg.yml's token handling: the token only
      # ever authenticates to GitHub, and nothing here can push to the
      # product repository.
      - name: Check out product repo (read-only)
        uses: actions/checkout@v4
        with:
          repository: leecalcote/blowhorn
          ref: ${{ env.SYNC_REF }}
          token: ${{ secrets.DMG_SOURCE_TOKEN }}
          path: product
          persist-credentials: false

      # The product's CLI reference pages are generated from its CLI schema
      # and parser. Regenerate them at this ref so a page that was not
      # rebuilt before its commit is never published stale. This is a
      # public repository, so these minutes cost nothing.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Regenerate the CLI reference
        run: |
          python -m pip install --quiet typer pyyaml
          make docs-cli-reference

      # Build on the open sync PR's branch, or on master when there is none
      # (fork PRs from a branch of the same name are ignored). See
      # .github/scripts/sync-docs-base-branch.sh.
      - name: Base the sync branch on the latest published state
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: make docs-sync-base SYNC_BRANCH="$SYNC_BRANCH"

      - name: Sync docs
        run: make docs-sync REF="$SYNC_REF" 2>&1 | tee /tmp/sync.log

      - name: Open or update the sync pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          OPEN_PR: ${{ steps.base.outputs.open_pr }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- content/en/docs)" ]; then
            echo "No docs changes to sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PRODUCT_SHA="$(git -C product rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/en/docs
          git commit -s -m "docs: sync from ${SYNC_REF}" \
            -m "Source: leecalcote/blowhorn@${PRODUCT_SHA}."
          git push --force-with-lease origin "$SYNC_BRANCH"
          TITLE="docs: sync from ${SYNC_REF}"
          {
            echo "Syncs the user docs from leecalcote/blowhorn@${SYNC_REF} (${PRODUCT_SHA})."
            echo
            echo "- Source: docs/{tutorials,how-to,reference,explanation} at that ref."
            echo "  docs/internal/, docs/gtm/ and internal-paths.txt entries are never copied."
            echo "- docs/_index.md becomes the docs landing (content/en/docs/_index.md) and each"
            echo "  section's _index.md its landing; docs/README.md is the product's GitHub index and is not copied."
            echo "- The product's reference/cli.md becomes the reference/cli/ section index, and the per-command"
            echo "  pages in reference/cli/, regenerated from the product's CLI schema at that ref, land beside it."
            echo "- Gated pages (draft: true) stay unpublished until the product ungates them."
            echo "- The sync merges this PR itself once the site checks it started on it pass, and the merge deploys."
            echo
            echo "Converter warnings (fix the converter, not the product docs):"
            echo
            grep '^sync-docs warning: ' /tmp/sync.log | sed 's/^sync-docs warning: /- /' \
              || echo "- None: every product link resolved inside the published tree."
            echo
            echo "Product-doc defects the converter cannot fix (fix upstream, then re-run the sync):"
            echo
            echo "<!-- maintainer: move any warning above that needs a product-side fix here -->"
            echo "- None known."
          } > /tmp/sync-pr-body.md
          if [ -n "$OPEN_PR" ]; then
            gh pr edit "$OPEN_PR" --title "$TITLE" --body-file /tmp/sync-pr-body.md
          else
            gh pr create --head "$SYNC_BRANCH" --base master \
              --title "$TITLE" --body-file /tmp/sync-pr-body.md
          fi

      # Pushes and pull requests made with github.token never start
      # pull_request or push workflows, so site.yml would otherwise stay
      # silent on the sync PR. A workflow_dispatch run started with that
      # same token is allowed and attaches to the branch head, so it shows
      # as the PR's check. Skipped when the sync found nothing to commit.
      - name: Start the site checks on the sync pull request
        if: steps.pr.outputs.changed != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: make docs-sync-start-checks SYNC_BRANCH="$SYNC_BRANCH"

      # Merge the sync PR once the checks above pass, then start the
      # master site run that deploys: master has no branch protection, so
      # GitHub's own auto-merge would merge at once with nothing to wait
      # for, and a merge made with github.token starts no push workflows
      # for the deploy. The make target waits for the checks, merges only
      # if they all pass, and dispatches the deploy. Skipped when the
      # sync found nothing to commit.
      - name: Merge the sync pull request and start the deploy
        if: steps.pr.outputs.changed != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: make docs-sync-merge SYNC_BRANCH="$SYNC_BRANCH"
