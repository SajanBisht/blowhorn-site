# Supported actions on Hacker News. See linkedin.yaml for the shared rules.
key: hacker-news
name: Hacker News
weight: 4
logo: assets/platforms/hacker-news-y18.svg
docs: /docs/reference/platforms/hacker-news/
reach: Your own browser, through the Blowhorn extension
actions:
  - id: post
    behavior: Submits a link or a text post. Titles hold up to 80 characters; a longer title is refused, never cut short, because a submission can't be edited once it's up.
    limits: At most 2 link submissions per profile per UTC day; only link submissions are recorded, so only they count toward the cap. Preview first with --dry-run, because every submission is permanent. Blowhorn never votes.
  - id: comment
    behavior: Comments on the Hacker News item your post is addressed to, under your name.
