# Supported actions on X. See linkedin.yaml for the shared rules.
key: x
name: X (Twitter)
weight: 2
logo: assets/platforms/x-logo-black.png
docs: /docs/reference/platforms/x/
reach: Your own signed-in browser, through the Blowhorn extension
actions:
  - id: post
    behavior: Publishes your message, with an image if you add one. A message longer than 274 characters goes out as a thread.
  - id: reply
    behavior: Replies in a conversation when your post is addressed to it.
  - id: amplify
    behavior: Retweets or quotes a post from each of your profiles.
  - id: follow
    behavior: Name a target account. With --limit 0, follow that account, or several comma-separated. With a positive limit, follow up to that many of the target's followers, never the target itself., skipping anyone you already follow.
    limits: At most 400 follows per profile a day, and 15 in any 15 minutes, counted from that profile's follow log on this computer.
  - id: analytics
    behavior: Records your follower and following counts on each run, so you can watch the trend.
    limits: Read-only.
