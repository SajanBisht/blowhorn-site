{{- $previous := .NextInSection -}}
{{- $next := .PrevInSection -}}

<ul class="list-unstyled d-flex justify-content-between align-items-center mb-0 pt-5">
  <li>
    <a {{if $previous}}href="{{ $previous.RelPermalink }}" aria-label="{{ T "ui_pager_prev" }} - {{ $previous.Title }}" {{end}}class="btn btn-primary{{if not $previous}} disabled{{end}}"><span class="me-1">←</span>{{ T "ui_pager_prev" }}</a>
  </li>
  <li>
    <a {{if $next}}href="{{ $next.RelPermalink }}" aria-label="{{ T "ui_pager_next" }} - {{ $next.Title }}" {{end}}class="btn btn-primary{{if not $next}} disabled{{end}}">{{ T "ui_pager_next" }}<span class="ms-1">→</span></a>
  </li>
</ul>
