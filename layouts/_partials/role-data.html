{{- /* The data/roles.json entry for a /for/<slug>/ page (its "role" param).
  Fails the build when the page names no role. */ -}}
{{- return partial "cast-data.html" (dict
    "page" .
    "slug" .Params.role
    "collection" site.Data.roles.roles
    "file" "data/roles.json"
    "kind" "role"
  ) -}}
