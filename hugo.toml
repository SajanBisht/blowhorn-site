# blowhorn.ai: Hugo with Docsy as a module, the same framework as
# layer5io/docs (https://github.com/layer5io/docs/blob/master/hugo.toml).
#
# The marketing and legal pages render through Blowhorn's own layouts
# (layouts/home.html, layouts/baseof.html, layouts/trust-center.html,
# layouts/legal.html, layouts/404.html);
# Docsy is imported for the /docs/ section. Never add analytics or anything
# loaded from another host: the privacy page (content/en/legal/privacy.md) promises
# no cookies, no analytics and no assets from third parties (the Download
# section's GitHub release lookup is the one disclosed outside request), and
# `make site-check` fails the build when a page loads from another host.

baseURL = "https://blowhorn.ai/"
title = "Blowhorn"
languageCode = "en"
relativeURLs = false
canonifyURLs = false

# Language settings
contentDir = "content/en"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
disableHugoGeneratorInject = true

# Gives pages a .Lastmod from git. CI checks out with fetch-depth: 0 so every
# page does not get HEAD's date; a page's own `lastmod` front matter wins.
enableGitInfo = true

# The site has no taxonomies and no feeds.
disableKinds = ["taxonomy", "term", "rss"]

# Pages at the top of content/en/ get ugly URLs (the home page is /index.html;
# layouts/_partials/canonical.html gives it the site root as its public URL).
# The legal pages, once /privacy.html and /terms.html, now live in the legal
# section at /legal/privacy/ and /legal/terms/, with `aliases:` redirects from
# the old paths. Sections such as /legal/ and /docs/ keep pretty URLs. A `url:`
# front matter value ending in .html would not do: it names one path for every
# output format, so the .md output would overwrite the .html page.
[uglyURLs]
  "" = true

[frontmatter]
  lastmod = ["lastmod", ":git", "date"]

[markup]
  [markup.goldmark]
    # Straight quotes and three dots, as the hand-written pages always had.
    [markup.goldmark.extensions.typographer]
      disable = true
    [markup.goldmark.parser.attribute]
      block = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    # Class output, not Chroma's default inline styles: inline styles fail
    # the no-inline-style check, and the classes inherit the site's own
    # pre/code token styles instead.
    noClasses = false

# `--minify` minifies CSS, JS and the text outputs but leaves HTML as the
# templates write it: html-validate checks the production build, and the HTML
# minifier lowercases the doctype and decodes entities that its rules require.
[minify]
  disableHTML = true

# llms.txt, llms-full.txt and an index.md beside every page, as docs.layer5.io
# publishes them. The output formats come from the gethugothemes llms-txt
# module (MIT, see THIRD-PARTY-NOTICES.md); its templates are copied into
# layouts/ rather than imported.
[outputFormats.llms]
  baseName = "llms"
  mediaType = "text/plain"
  isPlainText = true
  notAlternative = true

[outputFormats.llmsfull]
  baseName = "llms-full"
  mediaType = "text/plain"
  isPlainText = true
  notAlternative = true

[outputFormats.md]
  baseName = "index"
  mediaType = "text/markdown"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "llms", "llmsfull", "md"]
  page = ["HTML", "md"]
  section = ["HTML", "md"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  description = "Blowhorn is a social media console that takes one message and broadcasts, reposts and amplifies it across every profile and platform your community runs, on autopilot. Made for macOS."
  copyright = "Layer5, Inc."
  github_repo = "https://github.com/layer5io/blowhorn-site"
  github_branch = "master"
  # The account service URL. /signup, /login and
  # /early-access redirect here, and the welcome page links to it.
  # TODO(cloud.blowhorn.ai): switch to "https://cloud.blowhorn.ai" when the
  # Blowhorn-branded Cloud goes live. Keep in step with DEFAULT_CLOUD_URL in
  # leecalcote/blowhorn blowhorn/cloud/settings.py.
  cloud_url = "https://cloud.layer5.io"
  # Docsy's offline search, with lunr bundled locally (layouts/_partials/docs-head.html).
  offlineSearch = true
  offlineSearchMaxResults = 10

[params.llms]
  generate_llms_txt = true
  generate_llms_full_txt = true
  # The redirect and onboarding pages at the site root stay out of llms.txt,
  # as they stay out of sitemap.xml.
  exclude = ["/download/thanks/", "/install/", "/signup/", "/login/", "/welcome/", "/early-access/"]

# Hugo module configuration, as layer5io/docs.
[module]
  [module.hugoVersion]
    extended = true
    min = "0.147.2"
  [[module.imports]]
    path = "github.com/google/docsy"
    disable = false
  [[module.imports]]
    path = "github.com/google/docsy/dependencies"
    disable = false
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
