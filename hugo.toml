# blowhorn.ai: Hugo with Docsy as a module, the same framework as
# layer5io/docs (https://github.com/layer5io/docs/blob/master/hugo.toml).
#
# The marketing and legal pages render through Blowhorn's own layouts
# (layouts/home.html, layouts/baseof.html, layouts/trust-center.html,
# layouts/legal.html, layouts/404.html);
# Docsy is imported for the /docs/ section. Google Analytics 4 is the one
# analytics service ([services.googleAnalytics] below); nothing else may load
# from another host. The privacy page (content/en/legal/privacy.md) discloses
# it beside the Download section's GitHub release lookup, and `make site-check`
# fails the build when a page loads from any other host.

baseURL = "https://blowhorn.ai/"
title = "Blowhorn"
languageCode = "en"
relativeURLs = false
canonifyURLs = false

# Language settings
contentDir = "content/en"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
disableHugoGeneratorInject = true

# Gives pages a .Lastmod from git. CI checks out with fetch-depth: 0 so every
# page does not get HEAD's date; a page's own `lastmod` front matter wins.
enableGitInfo = true

# Taxonomies and feeds exist for the Resources center only (tags on
# resources; the /major/ dispatches feed is a custom output format).
# Everything else stays taxonomy-free and feed-free.
disableKinds = []


# Segments. `public` is every page outside /internal/; `internal` is the
# /internal/ section. A plain `hugo` build renders the public segment only.
# `hugo --environment internal` (config/internal/hugo.toml) renders `all`
# (public plus internal).
# Footguns: a --renderSegments flag overrides this setting; a segment name
# that is not defined renders nothing, with no error. See docs/deploy.md.
renderSegments = ["public"]

[segments]
  # A segment with no includes matches nothing, so `public` includes
  # everything and then excludes /internal/.
  [segments.public]
    [[segments.public.includes]]
      path = "**"
    [[segments.public.excludes]]
      path = "{/internal,/internal/**}"
  [segments.internal]
    [[segments.internal.includes]]
      path = "{/internal,/internal/**}"
  # Hugo 0.158 lets one segment's excludes win over another's includes, so
  # renderSegments = ["public", "internal"] still drops /internal/. The
  # internal build renders `all` instead.
  [segments.all]
    [[segments.all.includes]]
      path = "**"

# Pages at the top of content/en/ get ugly URLs (the home page is /index.html;
# layouts/_partials/canonical.html gives it the site root as its public URL).
# The legal pages, once /privacy.html and /terms.html, now live in the legal
# section at /legal/privacy/ and /legal/terms/, with `aliases:` redirects from
# the old paths. Sections such as /legal/ and /docs/ keep pretty URLs. A `url:`
# front matter value ending in .html would not do: it names one path for every
# output format, so the .md output would overwrite the .html page.
[uglyURLs]
  "" = true

[frontmatter]
  lastmod = ["lastmod", ":git", "date"]

[markup]
  [markup.goldmark]
    # Straight quotes and three dots, as the hand-written pages always had.
    [markup.goldmark.extensions.typographer]
      disable = true
    [markup.goldmark.parser.attribute]
      block = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    # Class output, not Chroma's default inline styles: inline styles fail
    # the no-inline-style check, and the classes inherit the site's own
    # pre/code token styles instead.
    noClasses = false

# `--minify` minifies CSS, JS and the text outputs but leaves HTML as the
# templates write it: html-validate checks the production build, and the HTML
# minifier lowercases the doctype and decodes entities that its rules require.
[minify]
  disableHTML = true

# llms.txt, llms-full.txt and an index.md beside every page, as docs.layer5.io
# publishes them. The output formats come from the gethugothemes llms-txt
# module (MIT, see THIRD-PARTY-NOTICES.md); its templates are copied into
# layouts/ rather than imported.
[outputFormats.llms]
  baseName = "llms"
  mediaType = "text/plain"
  isPlainText = true
  notAlternative = true

[outputFormats.llmsfull]
  baseName = "llms-full"
  mediaType = "text/plain"
  isPlainText = true
  notAlternative = true

# One taxonomy: tags. Resources pages carry them; nothing else does.
# There is deliberately no categories taxonomy - a video's categories
# front matter is a plain parameter (the category tree is the section
# tree under /resources/videos/), not a term list.
[taxonomies]
  tag = "tags"

[outputFormats.md]
  baseName = "index"
  mediaType = "text/markdown"
  isPlainText = true
  notAlternative = true

# Major Blowhorn's "Dispatches from the barracks" feed at /major/feed.xml.
[outputFormats.dispatches]
  baseName = "feed"
  mediaType = "application/rss+xml"
  isPlainText = false
  notAlternative = true

# Resources feeds, same shape as dispatches: /resources/feed.xml for the
# whole center and /resources/tags/<tag>/feed.xml per tag (the tag feeds
# are feed-only pages of type tagfeed). The in-product-intelligence tag
# feed is a published contract: the desktop homepage reads it.
[outputFormats.resourcesfeed]
  baseName = "feed"
  mediaType = "application/rss+xml"
  isPlainText = false
  notAlternative = true

[outputs]
  home = ["HTML", "llms", "llmsfull", "md"]
  page = ["HTML", "md"]
  section = ["HTML", "md"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

# Google Analytics 4 on every production page. layouts/_partials/analytics.html
# enables analytics storage while keeping advertising storage and
# personalization denied (marketing, legal and /docs/). Development builds and
# deploy previews send no hits.
[services.googleAnalytics]
  id = "G-2ZLYGVE3HN"

[params]
  # Shared opening of the "Strong signal" section on every /compare/<slug>/ page.
  versus_belief = "Blowhorn doesn't sell followers, likes or repost packages, and it never will. A like from someone paid to click is weak signal: it moves a number and nothing else. Strong signal is a reply, a question, a repost with a real take from someone who knows your work, a thread that turns into a discussion. Blowhorn exists to get your message in front of the people who would answer it, through the profiles of real people who chose to back you."
  description = "Blowhorn is a social media console that takes one message and broadcasts, reposts and amplifies it across every profile and platform your community runs, on autopilot. Runs on your machine."
  copyright = "Layer5, Inc."
  github_repo = "https://github.com/blowhorn-ai/blowhorn-site"
  github_branch = "master"
  # The account service URL. /signup, /login and
  # /early-access redirect here, and the welcome page links to it.
  # The Blowhorn account service. Keep in step
  # with DEFAULT_CLOUD_URL in the blowhorn repository's blowhorn/cloud/settings.py.
  cloud_url = "https://cloud.blowhorn.ai"
  # Docsy's offline search, with lunr bundled locally (layouts/_partials/docs-head.html).
  offlineSearch = true
  offlineSearchMaxResults = 10

[params.llms]
  generate_llms_txt = true
  generate_llms_full_txt = true
  # The redirect and onboarding pages at the site root stay out of llms.txt,
  # as they stay out of sitemap.xml.
  exclude = ["/download/thanks/", "/home-oil/", "/home-reveille/", "/install/", "/signup/", "/login/", "/welcome/", "/early-access/"]

# Hugo module configuration, as layer5io/docs.
[module]
  [module.hugoVersion]
    extended = true
    min = "0.147.2"
  [[module.imports]]
    path = "github.com/google/docsy"
    disable = false
  [[module.imports]]
    path = "github.com/google/docsy/dependencies"
    disable = false
  # Defining any mount drops Hugo's default mounts, so all of them are
  # declared here. The internal environment (config/internal/hugo.toml)
  # adds the private blowhorn repository's mounts on a module import and
  # leaves these project mounts as they are.
  [[module.mounts]]
    source = "content/en"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
